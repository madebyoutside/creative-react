name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Place the site
        id: dir
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "dest=" >> "$GITHUB_OUTPUT"
          else
            echo "dest=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.dir.outputs.dest }}
          keep_files: true
